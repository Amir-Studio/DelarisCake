<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="برای ثبت‌نام یا ورود به حساب کاربری دلاریس کیک و ثبت یا پیگیری سفارش کیک در قشم.">
<meta name="theme-color" content="#0b0b0d">
<title>حساب کاربری | دلاریس کیک</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="/DelarisCake/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://amir-studio.github.io/DelarisCake/menu.html">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(ellipse at 50% 20%,rgba(212,175,55,.09),transparent 55%),#0b0b0d}
.auth-card{width:min(100%,460px);padding:30px;border:1px solid rgba(212,175,55,.2);border-radius:24px;background:rgba(255,255,255,.025);box-shadow:0 24px 80px #0008}
.auth-brand{text-align:center;color:#e8c97a;font:26px Georgia,serif;letter-spacing:3px}
.auth-sub{text-align:center;color:#aaa;margin:8px 0 26px}
.auth-tabs{display:flex;gap:8px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:12px;border:1px solid #ffffff18;border-radius:12px;color:#ddd}
.auth-tabs button.active{background:linear-gradient(135deg,#d4af37,#e8c97a);color:#111}
.auth-form{display:grid;gap:14px}.auth-form[hidden]{display:none}
.auth-form label{display:grid;gap:7px;color:#d7c8a8;font-size:13px}
.auth-form input{width:100%;padding:13px;border:1px solid #b8955540;border-radius:10px;background:#151412;color:#fff;font:inherit}
.auth-form button{padding:13px;border-radius:12px;background:linear-gradient(135deg,#d4af37,#e8c97a);color:#111;font-weight:700}
.auth-form button:disabled{opacity:.55}
#authMessage{min-height:28px;line-height:1.8;text-align:center;font-size:13px}
.auth-back{display:block;text-align:center;color:#c7ab70;margin-top:20px}
</style></head>
<body><main class="auth-page"><section class="auth-card">
<div class="auth-brand">DELARIS CAKE</div><p class="auth-sub">حساب کاربری مشتریان</p>
<div class="auth-tabs"><button id="registerTab" class="active" type="button">ثبت‌نام</button><button id="loginTab" type="button">ورود</button></div>
<form id="registerForm" class="auth-form">
<label>نام و نام خانوادگی<input id="fullName" autocomplete="name" required minlength="2" maxlength="80" placeholder="نام شما"></label>
<label>ایمیل<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
<label>رمز عبور<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="حداقل ۸ کاراکتر"></label>
<button type="submit">ایجاد حساب کاربری</button>
</form>
<form id="loginForm" class="auth-form" hidden>
<label>ایمیل<input id="loginEmail" type="email" autocomplete="email" required></label>
<label>رمز عبور<input id="loginPassword" type="password" autocomplete="current-password" required></label>
<button type="submit">ورود به حساب</button>
</form>
<p id="authMessage" role="status" aria-live="polite"></p>
<a class="auth-back" href="index.html">بازگشت به دلاریس کیک</a>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script><script src="auth.js"></script>
</body></html>
