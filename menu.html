<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌نام و ورود | دلاریس کیک (Delaris Cake)</title>
    <meta name="description" content="برای ثبت‌نام در دلاریس کیک، اطلاعات تماس خود را وارد کنید یا اگر قبلاً ثبت‌نام کرده‌اید به صفحه گالری بازگردید.">
    <link rel="canonical" href="https://amir-studio.github.io/DelarisCake/menu.html">
    <meta name="robots" content="index,follow">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="register-page">
        <div class="register-card glass-card">
            <h1>ثبت‌نام / ورود</h1>
            <p>برای دسترسی به منوی اختصاصی، ثبت‌نام کنید</p>
            <form id="registerForm">
                <div class="input-group">
                    <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder=" " required aria-required="true" />
                    <label for="fullName">نام و نام خانوادگی</label>
                </div>
                <div class="input-group">
                    <input type="number" id="age" name="age" min="1" max="120" inputmode="numeric" placeholder=" " required aria-required="true" />
                    <label for="age">سن</label>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" autocomplete="email" placeholder=" " required aria-required="true" />
                    <label for="email">ایمیل</label>
                </div>
                <button type="submit" class="btn-enter btn-full gold-btn">
                    <span class="btn-text">ثبت‌نام</span>
                    <span class="btn-shimmer"></span>
                </button>
            </form>
            <div class="register-footer">
                <p>قبلاً ثبت‌نام کردید؟ <a href="dashboard.html">ورود به حساب</a></p>
            </div>
        </div>
    </main>

    <footer class="footer" style="margin-top:0; padding:20px 0; border-top: 1px solid rgba(255,255,255,0.04);">
        <div class="container">
            <div class="footer-content" style="grid-template-columns:1fr; text-align:center;">
                <div class="footer-brand">
                    <span class="footer-icon">🍰</span>
                    <h2>Delaris <span class="gold">Cake</span></h2>
                    <p>تماس با ما:</p>
                    <p style="margin:4px 0;">📞 ۰۹۱۷۹۱۳۱۰۳۷</p>
                    <p style="margin:4px 0;">📧 delaris0cake@gmail.com</p>
                    <p style="margin:4px 0;">📍 قشم، دولاب</p>
                    <p style="margin:4px 0;">📷 @delaris_cake07</p>
                </div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom" style="opacity:1;color:#aaa;">
                <span>&copy; ۱۴۰۵ تمامی حقوق محفوظ است.</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
